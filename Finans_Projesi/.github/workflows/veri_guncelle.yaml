name: Hacim ve Fiyat Guncelle
on:
  schedule:
    # UTC saatine göre 14:30 (TR 17:30) ve 15:30 (TR 18:30) olarak iki kez çalışır.
    - cron: '30 14,15 * * 1-5' 
  workflow_dispatch:
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt
      - name: Verileri Çek ve Veritabanına Yaz
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_data.py
